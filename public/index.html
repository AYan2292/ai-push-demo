<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的AI小伙伴</title>
  <meta name="theme-color" content="#ff6b9d">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffeef8 0%, #e0f7fa 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      padding: 30px 20px;
      margin-top: 40px;
    }
    h1 {
      color: #ff6b9d;
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .status {
      background: #f0fff4;
      border: 1px solid #9ae6b4;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #22543d;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .test-btn {
      background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
      color: white;
      margin-top: 10px;
    }
    .test-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
    }
    .tips {
      margin-top: 30px;
      padding: 15px;
      background: #f7fafc;
      border-radius: 12px;
      font-size: 13px;
      color: #718096;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💌 我的AI小伙伴</h1>
    <p class="subtitle">每天早上8点，ta会主动发消息给你</p>

    <div class="status">
      ✅ 服务已开启，微信推送已配置
    </div>

    <button class="test-btn" onclick="testPush()">发送测试消息</button>

    <div class="tips">
      📱 消息会直接推送到你的微信公众号「PushPlus」<br>
      ⏰ 每天早上8点自动发送一条AI生成的消息<br>
      💬 可以修改系统提示词，改变AI的人设和说话风格
    </div>
  </div>

  <script>
    async function testPush() {
      try {
        const res = await fetch('/api/test-push', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          alert('✅ 测试消息已发送！看看你的微信~');
        } else {
          alert('❌ 发送失败：' + (data.error || '未知错误'));
        }
      } catch (err) {
        alert('❌ 网络错误：' + err.message);
      }
    }
  </script>
</body>
</html>
